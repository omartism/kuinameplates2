name: CI-PR

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Install and run Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          args: "--no-default-config --no-color -qo '011'"
          annotate: warning

      - name: Create WoW Forever Package
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z -g forever -m .pkgmeta.yml

      - uses: actions/upload-artifact@v7
        with:
          name: KNP-PR${{ github.event.number }}-forever
          archive: false
          path: .release/
